<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Video</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: sans-serif;
        }
        .wrapper {
            width: 100%;
            max-width: 720px;
            padding: 10px;
            box-sizing: border-box;
        }
        video {
            width: 100%;
            height: auto;
            border-radius: 8px;
            background: #000;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <video controls playsinline>
            <source src="https://archive.org/download/video_20261004/video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>
</body>
</html>
