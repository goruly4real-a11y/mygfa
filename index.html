<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Video</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom tweaks for the video player pseudo-elements to look cleaner in webkit */
        video::-webkit-media-controls-panel {
            background-image: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col items-center justify-center p-4 sm:p-8 font-sans selection:bg-indigo-500 selection:text-white">
    
    <!-- Background subtle gradient glow -->
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[800px] h-[400px] bg-indigo-500/20 blur-[120px] rounded-full pointer-events-none -z-10"></div>

    <div class="w-full max-w-5xl mx-auto flex flex-col space-y-8 z-10">
        
        <header class="text-center space-y-3">
            <h1 class="text-3xl sm:text-4xl md:text-5xl font-extrabold tracking-tight text-white drop-shadow-sm">
                Featured Presentation
            </h1>
            <p class="text-sm sm:text-base text-zinc-400 max-w-2xl mx-auto">
                Press play to watch the video. Make sure your volume is turned up.
            </p>
        </header>

        <main class="w-full">
            <div class="relative w-full rounded-2xl overflow-hidden bg-black shadow-2xl shadow-black/80 ring-1 ring-white/10 aspect-video flex items-center justify-center">
                
                <video 
                    class="w-full h-full object-contain outline-none" 
                    controls 
                    preload="metadata"
                    playsinline
                    poster="https://placehold.co/1920x1080/09090b/a1a1aa?text=Video+Loading..."
                >
                    <!-- User should drop their video file in the root folder as 'video.mp4' -->
                    <source src="./video.mp4" type="video/mp4">
                    
                    <!-- Fallback message for older browsers -->
                    <p class="text-center p-4">
                        Your browser doesn't support HTML video. Here is a 
                        <a href="./video.mp4" class="text-indigo-400 underline hover:text-indigo-300">link to the video</a> instead.
                    </p>
                </video>
            </div>
        </main>

        <footer class="text-center text-zinc-500 text-sm mt-8">
            <p>&copy; <script>document.write(new Date().getFullYear())</script>. Hosted securely.</p>
        </footer>
    </div>

</body>
</html>
